spring.application.name=MyProject
spring.config.import=optional:file:.env[.properties]

# =========================
# DataSource
# =========================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA/Hibernate
# =========================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100


# =========================
# Flyway
# =========================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration


# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000


# =========================
# VNPay
# =========================

vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:https://vankhuongdev.id.vn/payment-result.html}
app.frontend-url=${FRONTEND_URL:https://vankhuongdev.id.vn}
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.secret-key=${VNPAY_SECRET_KEY}


# =========================
# SePay (VietQR & Webhook)
# =========================

sepay.bank-name=${SEPAY_BANK_NAME:TPBank}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:10000731064}
sepay.account-name=${SEPAY_ACCOUNT_NAME:DO VAN KHUONG}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:DH}


# =========================
# Groq AI (Chatbot)
# =========================

groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
chatbot.blocked-competitors=${CHATBOT_BLOCKED_COMPETITORS:cellphones,gearvn,phong vu,phongvu,the gioi di dong,tgdd,fpt shop,fptshop,an phat,anphat,hacom,hanoi computer,hanoicomputer,nguyen kim,dien may xanh,shopee,lazada,tiki,sendo,tiktok shop,thinkpro,laptop88,phuc anh,phucanh,nguyen cong,nguyencong,hotgear,xgear,minh an}


# =========================
# Google OAuth2
# =========================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


# =========================
# Server
# =========================

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# =========================
# Brevo Email
# =========================

brevo.api.key=${BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL}


# =========================
# Redis
# =========================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}


# =========================
# Logging
# =========================

logging.level.org.springframework.security=DEBUG